name: Build and Deploy MediaOrganizer to IIS

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  RUNTIME: 'win-x64'
  SYNCFUSION_NUGET_KEY: ${{ secrets.SYNCFUSION_NUGET_KEY }}

  API_PROJECT: 'MediaOrganizerApp.WebApi/MediaOrganizerApp.WebApi.csproj'
  WEB_PROJECT: 'Web.Blazor/Web.Blazor.csproj'

  # Os nomes dos app pools têm de coincidir com os logins SQL existentes.
  API_POOL: 'MediaOrganiserApi'
  WEB_POOL: 'OrganiseIt'

  API_SITE: 'MediaOrganiserApi'
  WEB_SITE: 'OrganiseIt'

  API_PORT: '4100'
  WEB_PORT: '4110'

  API_PATH: 'C:\inetpub\MediaOrganizerAPI'
  WEB_PATH: 'C:\inetpub\OrganiseIt'

  DEPLOY_PATH: 'C:\NewProjects\Publish\MediaOrganizer'
  BACKUP_PATH: 'C:\NewProjects\Publish\_backup_uploads'

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify NuGet configuration
        shell: powershell
        run: |
          $configPath = Join-Path $PWD "nuget.config"

          if (-not (Test-Path $configPath)) {
              throw "nuget.config nao encontrado."
          }

          $content = [System.IO.File]::ReadAllText($configPath).TrimStart()

          try {
              [xml]$config = $content
          }
          catch {
              throw "nuget.config contem XML invalido: $($_.Exception.Message)"
          }

          if (-not $config.configuration.packageSources) {
              throw "NuGet package sources nao configurados."
          }

          Write-Host "NuGet configuration valid."

      - name: Restore solution
        shell: powershell
        run: |
          dotnet restore MediaOrganizerApp.sln
          if ($LASTEXITCODE -ne 0) {
              throw "Restore da solucao falhou com codigo $LASTEXITCODE"
          }

      - name: Build solution
        shell: powershell
        run: |
          dotnet build MediaOrganizerApp.sln --configuration Release --no-restore
          if ($LASTEXITCODE -ne 0) {
              throw "Build da solucao falhou com codigo $LASTEXITCODE"
          }

      - name: Publish API (self-contained)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:DEPLOY_PATH 'api'

          if (Test-Path $out) {
              Remove-Item $out -Recurse -Force
          }

          New-Item -Path $out -ItemType Directory -Force | Out-Null

          dotnet publish $env:API_PROJECT `
            --configuration Release `
            --runtime $env:RUNTIME `
            --self-contained true `
            -p:PublishReadyToRun=false `
            --output $out

          if ($LASTEXITCODE -ne 0) {
              throw "Publish da API falhou com codigo $LASTEXITCODE"
          }

          # O web.config gerado aponta para este apphost (processPath). Se um
          # antivirus o colocar em quarentena (ex.: AVG/avast "IDP.Generic",
          # deteccao comportamental que da falsos positivos no apphost do .NET),
          # o robocopy falha mais tarde com um "ERROR 5 ... Acesso negado" e
          # "Robocopy API exit code: 9", sem dizer a causa. Falhamos aqui.
          $appHost = Join-Path $out 'MediaOrganizerApp.WebApi.exe'

          if (-not (Test-Path -LiteralPath $appHost)) {
              throw "O publish nao gerou '$appHost'. O web.config aponta para este executavel; verifique se o antivirus o colocou em quarentena (ex.: AVG/avast IDP.Generic) e adicione exclusoes para '$out' e '$env:DEPLOY_PATH'."
          }

      - name: Publish frontend (self-contained)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:DEPLOY_PATH 'web'

          if (Test-Path $out) {
              Remove-Item $out -Recurse -Force
          }

          New-Item -Path $out -ItemType Directory -Force | Out-Null

          dotnet publish $env:WEB_PROJECT `
            --configuration Release `
            --runtime $env:RUNTIME `
            --self-contained true `
            -p:PublishReadyToRun=false `
            --output $out

          if ($LASTEXITCODE -ne 0) {
              throw "Publish do frontend falhou com codigo $LASTEXITCODE"
          }

          # Mesma verificacao do publish da API: o web.config do Blazor aponta
          # para '.\Web.Blazor.exe'.
          $appHost = Join-Path $out 'Web.Blazor.exe'

          if (-not (Test-Path -LiteralPath $appHost)) {
              throw "O publish nao gerou '$appHost'. O web.config aponta para este executavel; verifique se o antivirus o colocou em quarentena (ex.: AVG/avast IDP.Generic) e adicione exclusoes para '$out' e '$env:DEPLOY_PATH'."
          }

      - name: Backup uploads and clean target folders
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "Current user: $(whoami)"

          Import-Module WebAdministration

          Write-Host "Stopping application pools..."

          foreach ($pool in @($env:API_POOL, $env:WEB_POOL)) {
              if (Test-Path "IIS:\AppPools\$pool") {
                  $state = (Get-WebAppPoolState -Name $pool).Value

                  Write-Host "Pool $pool state: $state"

                  if ($state -ne 'Stopped') {
                      Stop-WebAppPool -Name $pool
                      Write-Host "Pool $pool stopped."
                  }
              }
              else {
                  Write-Host "Pool $pool does not exist."
              }
          }

          Write-Host "Stopping IIS websites..."

          foreach ($site in @($env:API_SITE, $env:WEB_SITE)) {
              if (Get-Website -Name $site -ErrorAction SilentlyContinue) {
                  Stop-Website -Name $site
                  Write-Host "Site $site stopped."
              }
          }

          $files = Join-Path $env:WEB_PATH 'wwwroot\Files'

          if (Test-Path -LiteralPath $files) {

              $stamp = Get-Date -Format 'yyyyMMdd-HHmmss'
              $dest = Join-Path $env:BACKUP_PATH "Files-$stamp"

              New-Item -Path $dest -ItemType Directory -Force | Out-Null

              robocopy $files $dest /E /R:2 /W:2 /NFL /NDL /NJH /NJS /NP

              $rc = $LASTEXITCODE

              Write-Host "Robocopy exit code: $rc"

              if ($rc -gt 7) {
                  throw "Backup de wwwroot\Files falhou com codigo $rc"
              }

              Write-Host "Backup de wwwroot\Files concluido."
          }
          else {
              Write-Host "Folder $files not found. Backup skipped."
          }

          # IMPORTANTE:
          # O GitHub Actions pode interpretar o LASTEXITCODE do robocopy
          # como erro mesmo quando o script terminou com sucesso.

          $global:LASTEXITCODE = 0

          Write-Host "Backup step completed successfully."

          exit 0

      

      - name: Deploy to IIS
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "PASSO 1 - Import WebAdministration"
          Import-Module WebAdministration

          Write-Host "PASSO 2 - Criar diretorios e garantir ACLs"

          foreach ($path in @($env:API_PATH, $env:WEB_PATH)) {
              New-Item -Path $path -ItemType Directory -Force | Out-Null
          }

          # A identidade do pool (IIS APPPOOL\<pool>) tem de ler/escrever na pasta:
          # arranque, leitura do web.config, uploads em wwwroot\Files e ficheiros
          # gerados (PDFs/relatorios). Sem esta ACE o site depende da heranca de
          # C:\inetpub e o primeiro a falhar sao os uploads.
          $aclTargets = @(
              @{ Path = $env:API_PATH; Pool = $env:API_POOL },
              @{ Path = $env:WEB_PATH; Pool = $env:WEB_POOL }
          )

          foreach ($target in $aclTargets) {
              $identity = "IIS APPPOOL\$($target.Pool)"

              & icacls $target.Path /grant "${identity}:(OI)(CI)M" /C /Q | Out-Null

              if ($LASTEXITCODE -ne 0) {
                  throw "Nao foi possivel conceder Modify a '$identity' em '$($target.Path)' (icacls $LASTEXITCODE)."
              }

              Write-Host "ACL OK: $identity -> $($target.Path)"
          }

          Write-Host "PASSO 3 - Configurar App Pools"

          foreach ($pool in @($env:API_POOL, $env:WEB_POOL)) {

              Write-Host "A processar App Pool: $pool"

              if (-not (Test-Path "IIS:\AppPools\$pool")) {
                  New-WebAppPool -Name $pool | Out-Null
              }

              Set-ItemProperty "IIS:\AppPools\$pool" -Name managedRuntimeVersion -Value ''
              Set-ItemProperty "IIS:\AppPools\$pool" -Name managedPipelineMode -Value 'Integrated'
              Set-ItemProperty "IIS:\AppPools\$pool" -Name processModel.identityType -Value 'ApplicationPoolIdentity'

              # startMode/autoStart explicitos. Com startMode=AlwaysRunning o IIS
              # tenta pre-carregar a app logo que o pool arranca; se a pasta ainda
              # nao estiver completa fica o aviso 2303 (W3SVC-WP, 0x80070002).
              # O arranque passa a ser on-demand e deterministico.
              Set-ItemProperty "IIS:\AppPools\$pool" -Name startMode -Value 'OnDemand'
              Set-ItemProperty "IIS:\AppPools\$pool" -Name autoStart -Value $true

              # ASPNETCORE_ENVIRONMENT=Production explicito no app pool.
              # Sem isto, uma variavel a nivel de maquina pode fazer a app
              # arrancar em Development (HttpsRedirection + DeveloperExceptionPage).
              # Preserva as environmentVariables ja definidas no pool (nao as
              # substitui todas, como fazia a atribuicao direta de um hashtable).
              $poolItem = Get-Item "IIS:\AppPools\$pool"
              $envVars = @()

              if ($poolItem.environmentVariables -and $poolItem.environmentVariables.Collection) {
                  $envVars = @($poolItem.environmentVariables.Collection |
                      Where-Object { $_.name -ne 'ASPNETCORE_ENVIRONMENT' } |
                      ForEach-Object { @{ name = $_.name; value = $_.value } })
              }

              $envVars += @{ name = 'ASPNETCORE_ENVIRONMENT'; value = 'Production' }

              Set-ItemProperty "IIS:\AppPools\$pool" -Name environmentVariables -Value ([object[]]$envVars)

              $prodEnv = (Get-Item "IIS:\AppPools\$pool").environmentVariables.Collection |
                  Where-Object { $_.name -eq 'ASPNETCORE_ENVIRONMENT' }

              if (-not $prodEnv -or $prodEnv.value -ne 'Production') {
                  throw "O app pool '$pool' nao ficou com ASPNETCORE_ENVIRONMENT=Production."
              }
          }

          Write-Host "PASSO 4 - Deploy API"

          $apiSource = Join-Path $env:DEPLOY_PATH 'api'
          $apiExe = Join-Path $apiSource 'MediaOrganizerApp.WebApi.exe'

          # O apphost tem de existir ANTES do robocopy. Um antivirus pode
          # elimina-lo entre o publish e este passo (AVG/avast IDP.Generic).
          if (-not (Test-Path -LiteralPath $apiExe)) {
              throw "O publish nao tem '$apiExe'. Verifique a quarentena do antivirus (ex.: AVG/avast IDP.Generic) e adicione exclusoes para '$apiSource' e '$env:DEPLOY_PATH'."
          }

          robocopy $apiSource $env:API_PATH /MIR /R:3 /W:5 /NFL /NDL /NJH /NJS /NP

          $apiRc = $LASTEXITCODE

          Write-Host "Robocopy API exit code: $apiRc"

          if ($apiRc -gt 7) {
              throw "Deploy da API falhou com codigo $apiRc (8/9 = ficheiros por copiar; causa tipica: antivirus a bloquear/quarentena o 'MediaOrganizerApp.WebApi.exe'). Verifique a quarentena (IDP.Generic) e as exclusoes para '$apiSource' e '$env:API_PATH'."
          }

          if (-not (Test-Path -LiteralPath (Join-Path $env:API_PATH 'MediaOrganizerApp.WebApi.exe'))) {
              throw "O deploy da API terminou mas '$env:API_PATH\MediaOrganizerApp.WebApi.exe' nao existe. Verifique a quarentena do antivirus (IDP.Generic) e as exclusoes."
          }

          Write-Host "PASSO 5 - Deploy Frontend"

          $webSource = Join-Path $env:DEPLOY_PATH 'web'
          $webExe = Join-Path $webSource 'Web.Blazor.exe'

          if (-not (Test-Path -LiteralPath $webExe)) {
              throw "O publish nao tem '$webExe'. Verifique a quarentena do antivirus (ex.: AVG/avast IDP.Generic) e adicione exclusoes para '$webSource' e '$env:DEPLOY_PATH'."
          }

          robocopy $webSource $env:WEB_PATH /MIR /R:3 /W:5 /NFL /NDL /NJH /NJS /NP

          $webRc = $LASTEXITCODE

          Write-Host "Robocopy Frontend exit code: $webRc"

          if ($webRc -gt 7) {
              throw "Deploy do frontend falhou com codigo $webRc (8/9 = ficheiros por copiar; causa tipica: antivirus a bloquear/quarentena o 'Web.Blazor.exe'). Verifique a quarentena (IDP.Generic) e as exclusoes para '$webSource' e '$env:WEB_PATH'."
          }

          if (-not (Test-Path -LiteralPath (Join-Path $env:WEB_PATH 'Web.Blazor.exe'))) {
              throw "O deploy do frontend terminou mas '$env:WEB_PATH\Web.Blazor.exe' nao existe. Verifique a quarentena do antivirus (IDP.Generic) e as exclusoes."
          }

          Write-Host "PASSO 6 - Configurar Site API"

          if (-not (Get-Website -Name $env:API_SITE -ErrorAction SilentlyContinue)) {
              New-Website -Name $env:API_SITE `
                -Port ([int]$env:API_PORT) `
                -IPAddress '*' `
                -PhysicalPath $env:API_PATH `
                -ApplicationPool $env:API_POOL | Out-Null
          }
          else {
              Set-ItemProperty "IIS:\Sites\$($env:API_SITE)" -Name physicalPath -Value $env:API_PATH
              Set-ItemProperty "IIS:\Sites\$($env:API_SITE)" -Name applicationPool -Value $env:API_POOL
          }

          # Preload desligado de forma explicita: com preload ligado o IIS tenta
          # arrancar a app assim que o pool arranca e, se a pasta ainda nao
          # estiver completa, regista o aviso 2303 (W3SVC-WP, 0x80070002).
          & "$env:windir\system32\inetsrv\appcmd.exe" set app "$($env:API_SITE)/" /preloadEnabled:false | Out-Null

          if ($LASTEXITCODE -ne 0) {
              throw "Nao foi possivel definir preloadEnabled=false no site '$($env:API_SITE)'."
          }

          # Access logs de IIS: sem eles um 500.x fica sem qualquer rasto.
          try {
              Set-ItemProperty "IIS:\Sites\$($env:API_SITE)" -Name logFile.enabled -Value $true
          }
          catch {
              Write-Warning "Nao foi possivel ligar o access log do site '$($env:API_SITE)': $($_.Exception.Message)"
          }

          Write-Host "PASSO 7 - Certificado"

          $cert = Get-ChildItem Cert:\LocalMachine\My |
              Where-Object {
                  $_.Subject -like '*localhost*' -and
                  $_.NotAfter -gt (Get-Date).AddDays(30)
              } |
              Select-Object -First 1

          if (-not $cert) {
              $cert = New-SelfSignedCertificate `
                  -DnsName 'localhost' `
                  -CertStoreLocation 'Cert:\LocalMachine\My' `
                  -NotAfter (Get-Date).AddYears(5) `
                  -FriendlyName 'MediaOrganizer localhost'
          }

          Write-Host "PASSO 8 - Configurar Site Frontend"

          $webSite = Get-Website -Name $env:WEB_SITE -ErrorAction SilentlyContinue

          if (-not $webSite) {
              New-Website -Name $env:WEB_SITE `
                -Port ([int]$env:WEB_PORT) `
                -IPAddress '*' `
                -PhysicalPath $env:WEB_PATH `
                -ApplicationPool $env:WEB_POOL | Out-Null
          }
          else {
              Set-ItemProperty "IIS:\Sites\$($env:WEB_SITE)" -Name physicalPath -Value $env:WEB_PATH
              Set-ItemProperty "IIS:\Sites\$($env:WEB_SITE)" -Name applicationPool -Value $env:WEB_POOL
          }

          # Mesmo motivo do site da API: preload on/off explicito e access logs ligados.
          & "$env:windir\system32\inetsrv\appcmd.exe" set app "$($env:WEB_SITE)/" /preloadEnabled:false | Out-Null

          if ($LASTEXITCODE -ne 0) {
              throw "Nao foi possivel definir preloadEnabled=false no site '$($env:WEB_SITE)'."
          }

          try {
              Set-ItemProperty "IIS:\Sites\$($env:WEB_SITE)" -Name logFile.enabled -Value $true
          }
          catch {
              Write-Warning "Nao foi possivel ligar o access log do site '$($env:WEB_SITE)': $($_.Exception.Message)"
          }

          Write-Host "PASSO 9 - Configurar HTTPS"

          $bindingInfo = "*:$($env:WEB_PORT):"

          Get-WebBinding -Name $env:WEB_SITE -Protocol http -ErrorAction SilentlyContinue |
              Where-Object { $_.bindingInformation -eq $bindingInfo } |
              Remove-WebBinding -Confirm:$false

          $existing = Get-WebBinding -Name $env:WEB_SITE -Protocol https -ErrorAction SilentlyContinue |
              Where-Object { $_.bindingInformation -eq $bindingInfo } |
              Select-Object -First 1

          if (-not $existing) {
              New-WebBinding -Name $env:WEB_SITE `
                -Protocol https `
                -Port ([int]$env:WEB_PORT) `
                -IPAddress '*' `
                -SslFlags 0 `
                -Force | Out-Null
          }

          Set-WebBinding -Name $env:WEB_SITE -BindingInformation $bindingInfo -PropertyName 'sslFlags' -Value '0'

          # O certificado NAO se liga ao endpoint com
          # 'Set-WebBinding -PropertyName iisCertificateThumbprint': essa
          # propriedade nao existe no binding (protocol/bindingInformation/
          # sslFlags). O resultado era um endpoint HTTPS sem certificado no
          # HTTP.sys -> handshake TLS abortado + HttpEvent 15021 no log System,
          # com o deploy a reportar sucesso.
          $ipport = "0.0.0.0:$($env:WEB_PORT)"

          $existingSsl = (& "$env:windir\system32\netsh.exe" http show sslcert "ipport=$ipport") -join "`n"

          if ($existingSsl -match 'IP:port') {
              Write-Host "A remover binding SSL anterior para $ipport"
              & "$env:windir\system32\netsh.exe" http delete sslcert "ipport=$ipport" | Out-Null
          }

          $httpsBinding = Get-WebBinding -Name $env:WEB_SITE -Protocol https -ErrorAction SilentlyContinue |
              Where-Object { $_.bindingInformation -eq $bindingInfo } |
              Select-Object -First 1

          if (-not $httpsBinding) {
              throw "O site '$($env:WEB_SITE)' nao tem binding HTTPS '$bindingInfo'."
          }

          Write-Host "A ligar o certificado $($cert.Thumbprint) ao endpoint $ipport"
          $httpsBinding.AddSslCertificate($cert.Thumbprint, 'My')

          $verifySsl = (& "$env:windir\system32\netsh.exe" http show sslcert "ipport=$ipport") -join "`n"

          if ($verifySsl -notmatch 'IP:port') {
              throw "O endpoint $ipport nao ficou com certificado SSL registado no HTTP.sys (netsh http add sslcert falhou)."
          }

          if ($verifySsl.ToLower() -notmatch [regex]::Escape($cert.Thumbprint.ToLower())) {
              throw "O endpoint $ipport nao ficou com o certificado $($cert.Thumbprint). Ver 'netsh http show sslcert ipport=$ipport'."
          }

          Write-Host "Certificado ligado e verificado em $ipport."

          Write-Host "PASSO 10 - Arrancar App Pools"

          foreach ($pool in @($env:API_POOL, $env:WEB_POOL)) {
              if ((Get-WebAppPoolState -Name $pool).Value -ne 'Started') {
                  Start-WebAppPool -Name $pool
              }

              $state = (Get-WebAppPoolState -Name $pool).Value

              if ($state -ne 'Started') {
                  throw "O app pool '$pool' nao arrancou (estado: $state)."
              }

              Write-Host "Pool ${pool}: $state"
          }

          Write-Host "PASSO 11 - Arrancar Sites"

          foreach ($site in @($env:API_SITE, $env:WEB_SITE)) {
              if ((Get-Website -Name $site).State -ne 'Started') {
                  Start-Website -Name $site
              }

              $siteState = (Get-Website -Name $site).State

              if ($siteState -ne 'Started') {
                  throw "O site '$site' nao arrancou (estado: $siteState)."
              }

              Write-Host "Site ${site}: $siteState"
          }

          Write-Host "PASSO 12 - Deploy terminado"

          $global:LASTEXITCODE = 0
          exit 0

      # Sem este passo o workflow fica verde mesmo quando o IIS nao serve nada
      # (500.19 de configuracao, 500.0 do ANCM, TLS abortado no 4110, BD sem
      # acesso). Verifica a app real depois de os sites arrancarem.
      - name: Smoke test (site API, Blazor e base de dados)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          # Certificado auto-assinado: a validade da cadeia nao e o que se testa
          # aqui. O que se quer provar e que o 4110 responde e nao aborta o TLS.
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          [Net.ServicePointManager]::ServerCertificateValidationCallback = { $true }

          function Invoke-Probe {
              param(
                  [Parameter(Mandatory = $true)][string]$Url,
                  [hashtable]$Headers = @{}
              )

              try {
                  $response = Invoke-WebRequest -Uri $Url -UseBasicParsing -TimeoutSec 20 -Headers $Headers -ErrorAction Stop

                  return [pscustomobject]@{ Code = [int]$response.StatusCode; Body = [string]$response.Content; Error = $null }
              }
              catch [System.Net.WebException] {
                  $webResponse = $_.Exception.Response

                  if (-not $webResponse) {
                      # Sem resposta = ligacao/TLS abortados.
                      return [pscustomobject]@{ Code = 0; Body = ''; Error = $_.Exception.Message }
                  }

                  $body = ''

                  try {
                      $reader = New-Object System.IO.StreamReader($webResponse.GetResponseStream())
                      $body = $reader.ReadToEnd()
                      $reader.Dispose()
                  }
                  catch { }

                  return [pscustomobject]@{ Code = [int]$webResponse.StatusCode; Body = $body; Error = $null }
              }
              catch {
                  return [pscustomobject]@{ Code = 0; Body = ''; Error = $_.Exception.Message }
              }
          }

          # A ApiKey vive no appsettings publicado (o middleware exige o header em
          # todos os pedidos: sem ela a resposta e 401, nao 200).
          function Get-DeployedApiKey {
              foreach ($name in @('appsettings.Production.json', 'appsettings.json')) {
                  $file = Join-Path $env:API_PATH $name

                  if (-not (Test-Path -LiteralPath $file)) { continue }

                  try {
                      $settings = Get-Content -LiteralPath $file -Raw | ConvertFrom-Json

                      if ($settings.ApiKey) { return [string]$settings.ApiKey }
                  }
                  catch { }
              }

              return $null
          }

          function Test-Healthy([object]$Api, [object]$Web) {
              return ($Api.Code -eq 200) -and ($Web.Code -ge 200) -and ($Web.Code -lt 400)
          }

          $apiUrl = "http://localhost:$($env:API_PORT)/api/dashboard/health"
          $webUrl = "https://localhost:$($env:WEB_PORT)/"

          $apiHeaders = @{}
          $apiKey = Get-DeployedApiKey

          if ($apiKey) {
              $apiHeaders['ApiKey'] = $apiKey
          }
          else {
              Write-Warning "ApiKey nao encontrada em '$env:API_PATH\appsettings*.json'; o probe corre sem header (401 esperado)."
          }

          Write-Host "Probe API : $apiUrl"
          Write-Host "Probe Web : $webUrl"

          $deadline = (Get-Date).AddSeconds(180)
          $attempt = 0
          $api = [pscustomobject]@{ Code = 0; Body = ''; Error = 'sem pedido' }
          $web = [pscustomobject]@{ Code = 0; Body = ''; Error = 'sem pedido' }

          while ((Get-Date) -lt $deadline) {
              $attempt++

              $api = Invoke-Probe -Url $apiUrl -Headers $apiHeaders
              $web = Invoke-Probe -Url $webUrl

              Write-Host ("Tentativa {0}: API={1}  Blazor={2}" -f $attempt, $api.Code, $web.Code)

              if (Test-Healthy $api $web) { break }

              Start-Sleep -Seconds 5
          }

          if (-not (Test-Healthy $api $web)) {
              Write-Host ""
              Write-Host "===== DIAGNOSTICO DO SMOKE TEST ====="
              Write-Host "API  -> code=$($api.Code) erro=$($api.Error)"

              if ($api.Body) {
                  Write-Host "API body (primeiros 1500 chars):"
                  Write-Host $api.Body.Substring(0, [Math]::Min(1500, $api.Body.Length))
              }

              Write-Host "Web  -> code=$($web.Code) erro=$($web.Error)"

              if ($web.Body) {
                  Write-Host "Web body (primeiros 500 chars):"
                  Write-Host $web.Body.Substring(0, [Math]::Min(500, $web.Body.Length))
              }

              Import-Module WebAdministration

              Write-Host "--- App pools / sites ---"

              foreach ($pool in @($env:API_POOL, $env:WEB_POOL)) {
                  Write-Host ("pool {0} = {1}" -f $pool, (Get-WebAppPoolState -Name $pool).Value)
              }

              foreach ($site in @($env:API_SITE, $env:WEB_SITE)) {
                  Write-Host ("site {0} = {1}" -f $site, (Get-Website -Name $site).State)
              }

              Write-Host "--- netsh http show sslcert ---"
              (& "$env:windir\system32\netsh.exe" http show sslcert) -join "`n" | Write-Host

              Write-Host "--- Eventos IIS/WAS (ultimos 30 min) ---"
              Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = (Get-Date).AddMinutes(-30) } -ErrorAction SilentlyContinue |
                  Where-Object { $_.ProviderName -match 'IIS|WAS' } |
                  Select-Object -Last 15 TimeCreated, Id, ProviderName, @{ n = 'Msg'; e = { ($_.Message -split "`r?`n")[0] } } |
                  Format-Table -AutoSize -Wrap | Out-String -Width 200 | Write-Host

              Get-WinEvent -FilterHashtable @{ LogName = 'System'; StartTime = (Get-Date).AddMinutes(-30) } -ErrorAction SilentlyContinue |
                  Where-Object { $_.ProviderName -match 'IIS|WAS|HttpEvent' } |
                  Select-Object -Last 15 TimeCreated, Id, ProviderName, @{ n = 'Msg'; e = { ($_.Message -split "`r?`n")[0] } } |
                  Format-Table -AutoSize -Wrap | Out-String -Width 200 | Write-Host

              throw "Smoke test falhou: a app nao ficou utilizavel depois do deploy (API=$($api.Code), Blazor=$($web.Code)). Diagnostico acima."
          }

          Write-Host "Smoke test OK: API=200 (/api/dashboard/health) e Blazor=$($web.Code) em HTTPS."

          $global:LASTEXITCODE = 0
          exit 0
