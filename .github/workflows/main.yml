
name: Build and Deploy MediaOrganizer to IIS

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  RUNTIME: 'win-x64'

  # Syncfusion License Key (GitHub Secret)
  SYNCFUSION_LICENSE_KEY: ${{ secrets.SYNCFUSION_NUGET_KEY }}

  API_PROJECT: 'MediaOrganizerApp.WebApi/MediaOrganizerApp.WebApi.csproj'
  WEB_PROJECT: 'Web.Blazor/Web.Blazor.csproj'

  # Os nomes dos app pools têm de coincidir com os logins SQL existentes
  API_POOL: 'MediaOrganiserApi'
  WEB_POOL: 'OrganiseIt'

  API_SITE: 'MediaOrganiserApi'
  WEB_SITE: 'OrganiseIt'

  API_PORT: '4100'
  WEB_PORT: '4110'

  API_PATH: 'C:\inetpub\MediaOrganizerAPI'
  WEB_PATH: 'C:\inetpub\OrganiseIt'

  DEPLOY_PATH: 'C:\NewProjects\Publish\MediaOrganizer'
  BACKUP_PATH: 'C:\NewProjects\Publish\_backup_uploads'

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:

      # --------------------------------------------------
      # 1. CHECKOUT
      # --------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. VALIDAR NUGET CONFIG
      # --------------------------------------------------

      - name: Verify NuGet configuration
        shell: powershell
        run: |
          [xml]$config = Get-Content ".\nuget.config"

          if (-not $config.configuration.packageSources) {
              throw "NuGet package sources nao configurados."
          }

          Write-Host "NuGet configuration valid."

      # --------------------------------------------------
      # 3. RESTORE
      # --------------------------------------------------

      - name: Restore solution
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          dotnet restore MediaOrganizerApp.sln `
            --configfile ".\nuget.config" `
            --verbosity minimal

          if ($LASTEXITCODE -ne 0) {
              throw "NuGet Restore falhou com codigo $LASTEXITCODE"
          }

      # --------------------------------------------------
      # 4. BUILD
      # --------------------------------------------------

      - name: Build solution
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          dotnet build MediaOrganizerApp.sln `
            --configuration Release `
            --no-restore

          if ($LASTEXITCODE -ne 0) {
              throw "Build falhou com codigo $LASTEXITCODE"
          }

      # --------------------------------------------------
      # 5. PUBLISH API
      # --------------------------------------------------

      - name: Publish API (self-contained)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $out = Join-Path $env:DEPLOY_PATH 'api'

          if (Test-Path $out) {
              Remove-Item $out -Recurse -Force
          }

          New-Item -Path $out -ItemType Directory -Force | Out-Null

          dotnet publish $env:API_PROJECT `
            --configuration Release `
            --runtime $env:RUNTIME `
            --self-contained true `
            -p:PublishReadyToRun=false `
            --output $out

          if ($LASTEXITCODE -ne 0) {
              throw "Publish da API falhou com codigo $LASTEXITCODE"
          }

      # --------------------------------------------------
      # 6. PUBLISH FRONTEND
      # --------------------------------------------------

      - name: Publish frontend (self-contained)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $out = Join-Path $env:DEPLOY_PATH 'web'

          if (Test-Path $out) {
              Remove-Item $out -Recurse -Force
          }

          New-Item -Path $out -ItemType Directory -Force | Out-Null

          dotnet publish $env:WEB_PROJECT `
            --configuration Release `
            --runtime $env:RUNTIME `
            --self-contained true `
            -p:PublishReadyToRun=false `
            --output $out

          if ($LASTEXITCODE -ne 0) {
              throw "Publish do frontend falhou com codigo $LASTEXITCODE"
          }

      # --------------------------------------------------
      # 7. BACKUP E PARAGEM DO IIS
      # --------------------------------------------------

      - name: Backup uploads and clean target folders
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          Import-Module WebAdministration

          # Parar App Pools
          foreach ($pool in @($env:API_POOL, $env:WEB_POOL)) {

              if (Test-Path "IIS:\AppPools\$pool") {

                  $state = (Get-WebAppPoolState -Name $pool).Value

                  if ($state -ne 'Stopped') {
                      Stop-WebAppPool -Name $pool
                  }
              }
          }

          # Parar Websites
          foreach ($site in @($env:API_SITE, $env:WEB_SITE)) {

              if (Get-Website -Name $site -ErrorAction SilentlyContinue) {
                  Stop-Website -Name $site
              }
          }

          # Backup de wwwroot\Files
          $files = Join-Path $env:WEB_PATH 'wwwroot\Files'

          if (Test-Path -LiteralPath $files) {

              $stamp = Get-Date -Format 'yyyyMMdd-HHmmss'

              $dest = Join-Path $env:BACKUP_PATH "Files-$stamp"

              New-Item -Path $dest -ItemType Directory -Force | Out-Null

              & robocopy $files $dest /E /R:2 /W:2 /NFL /NDL /NJH /NJS /NP

              if ($LASTEXITCODE -gt 7) {
                  throw "Backup de wwwroot\Files falhou com codigo $LASTEXITCODE"
              }

              Write-Host "Backup de wwwroot\Files concluido."
          }

      # --------------------------------------------------
      # 8. DEPLOY IIS
      # --------------------------------------------------

      - name: Deploy to IIS
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          Import-Module WebAdministration

          # Criar pastas
          foreach ($path in @($env:API_PATH, $env:WEB_PATH)) {
              New-Item -Path $path -ItemType Directory -Force | Out-Null
          }

          # Configurar App Pools
          foreach ($pool in @($env:API_POOL, $env:WEB_POOL)) {

              if (-not (Test-Path "IIS:\AppPools\$pool")) {
                  New-WebAppPool -Name $pool | Out-Null
              }

              Set-ItemProperty "IIS:\AppPools\$pool" `
                  -Name managedRuntimeVersion -Value ''

              Set-ItemProperty "IIS:\AppPools\$pool" `
                  -Name managedPipelineMode -Value 'Integrated'

              Set-ItemProperty "IIS:\AppPools\$pool" `
                  -Name processModel.identityType -Value 'ApplicationPoolIdentity'
          }

          # Deploy API
          & robocopy (Join-Path $env:DEPLOY_PATH 'api') $env:API_PATH `
              /MIR /R:3 /W:5 /NFL /NDL /NJH /NJS /NP

          if ($LASTEXITCODE -gt 7) {
              throw "Deploy da API falhou com codigo $LASTEXITCODE"
          }

          # Deploy Frontend
          & robocopy (Join-Path $env:DEPLOY_PATH 'web') $env:WEB_PATH `
              /MIR /R:3 /W:5 /NFL /NDL /NJH /NJS /NP

          if ($LASTEXITCODE -gt 7) {
              throw "Deploy do frontend falhou com codigo $LASTEXITCODE"
          }

          # Criar ou atualizar Website API
          if (-not (Get-Website -Name $env:API_SITE -ErrorAction SilentlyContinue)) {

              New-Website -Name $env:API_SITE `
                  -Port ([int]$env:API_PORT) `
                  -IPAddress '*' `
                  -PhysicalPath $env:API_PATH `
                  -ApplicationPool $env:API_POOL | Out-Null

          } else {

              Set-ItemProperty "IIS:\Sites\$($env:API_SITE)" `
                  -Name physicalPath -Value $env:API_PATH

              Set-ItemProperty "IIS:\Sites\$($env:API_SITE)" `
                  -Name applicationPool -Value $env:API_POOL
          }

          # Certificado HTTPS localhost
          $cert = Get-ChildItem Cert:\LocalMachine\My |
              Where-Object {
                  $_.Subject -like '*localhost*' -and
                  $_.NotAfter -gt (Get-Date).AddDays(30)
              } |
              Select-Object -First 1

          if (-not $cert) {

              $cert = New-SelfSignedCertificate `
                  -DnsName 'localhost' `
                  -CertStoreLocation 'Cert:\LocalMachine\My' `
                  -NotAfter (Get-Date).AddYears(5) `
                  -FriendlyName 'MediaOrganizer localhost'
          }

          # Criar ou atualizar Website Frontend
          $webSite = Get-Website -Name $env:WEB_SITE -ErrorAction SilentlyContinue

          if (-not $webSite) {

              New-Website -Name $env:WEB_SITE `
                  -Port ([int]$env:WEB_PORT) `
                  -IPAddress '*' `
                  -PhysicalPath $env:WEB_PATH `
                  -ApplicationPool $env:WEB_POOL | Out-Null

          } else {

              Set-ItemProperty "IIS:\Sites\$($env:WEB_SITE)" `
                  -Name physicalPath -Value $env:WEB_PATH

              Set-ItemProperty "IIS:\Sites\$($env:WEB_SITE)" `
                  -Name applicationPool -Value $env:WEB_POOL
          }

          # Remover binding HTTP do frontend
          $bindingInfo = "*:$($env:WEB_PORT):"

          Get-WebBinding -Name $env:WEB_SITE -Protocol http `
              -ErrorAction SilentlyContinue |
              Where-Object {
                  $_.bindingInformation -eq $bindingInfo
              } |
              Remove-WebBinding -Confirm:$false

          # Criar binding HTTPS
          $existing = Get-WebBinding -Name $env:WEB_SITE -Protocol https `
              -ErrorAction SilentlyContinue |
              Where-Object {
                  $_.bindingInformation -eq $bindingInfo
              } |
              Select-Object -First 1

          if (-not $existing) {

              New-WebBinding -Name $env:WEB_SITE `
                  -Protocol https `
                  -Port ([int]$env:WEB_PORT) `
                  -IPAddress '*' `
                  -SslFlags 0 `
                  -Force | Out-Null
          }

          Set-WebBinding -Name $env:WEB_SITE `
              -BindingInformation $bindingInfo `
              -PropertyName 'sslFlags' -Value '0'

          Set-WebBinding -Name $env:WEB_SITE `
              -BindingInformation $bindingInfo `
              -PropertyName 'certificateStoreName' -Value 'My'

          Set-WebBinding -Name $env:WEB_SITE `
              -BindingInformation $bindingInfo `
              -PropertyName 'iisCertificateThumbprint' `
              -Value $cert.Thumbprint

          # Configurar variáveis de ambiente dos App Pools
          foreach ($pool in @($env:API_POOL, $env:WEB_POOL)) {

              $poolEnv = "IIS:\AppPools\$pool\EnvironmentVariables"

              if (-not (Test-Path $poolEnv)) {
                  New-Item -Path $poolEnv -Force | Out-Null
              }

              Set-ItemProperty $poolEnv `
                  -Name 'ASPNETCORE_ENVIRONMENT' `
                  -Value 'Production'

              # Licença Syncfusion
              if (-not [string]::IsNullOrWhiteSpace($env:SYNCFUSION_LICENSE_KEY)) {

                  Set-ItemProperty $poolEnv `
                      -Name 'SYNCFUSION_LICENSE_KEY' `
                      -Value $env:SYNCFUSION_LICENSE_KEY
              }
          }

          # Arrancar App Pools e Websites
          foreach ($pool in @($env:API_POOL, $env:WEB_POOL)) {
              Start-WebAppPool -Name $pool
          }

          foreach ($site in @($env:API_SITE, $env:WEB_SITE)) {
              Start-Website -Name $site
          }

      # --------------------------------------------------
      # 9. SMOKE TEST
      # --------------------------------------------------

      - name: Smoke test
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          # Certificado auto-assinado
          [System.Net.ServicePointManager]::ServerCertificateValidationCallback = { $true }

          # Verificar App Pools
          foreach ($pool in @($env:API_POOL, $env:WEB_POOL)) {

              $deadline = (Get-Date).AddSeconds(60)

              while (
                  (Get-WebAppPoolState -Name $pool).Value -ne 'Running' -and
                  (Get-Date) -lt $deadline
              ) {
                  Start-Sleep -Seconds 2
              }

              if ((Get-WebAppPoolState -Name $pool).Value -ne 'Running') {
                  throw "App pool '$pool' nao arrancou"
              }
          }

          Start-Sleep -Seconds 5

          # Endpoints
          $targets = @(
              @{
                  Name = 'API'
                  Uri = "http://localhost:$($env:API_PORT)/"
              },
              @{
                  Name = 'Frontend'
                  Uri = "https://localhost:$($env:WEB_PORT)/"
              }
          )

          foreach ($t in $targets) {

              try {

                  $r = Invoke-WebRequest `
                      -Uri $t.Uri `
                      -UseBasicParsing `
                      -TimeoutSec 60

                  $code = $r.StatusCode

              } catch [System.Net.WebException] {

                  if ($null -eq $_.Exception.Response) {
                      $code = 0
                  } else {
                      $code = [int]$_.Exception.Response.StatusCode
                  }

              } catch {

                  throw "$($t.Name) falhou ao pedir $($t.Uri): $($_.Exception.Message)"
              }

              if ($code -eq 0) {
                  throw "$($t.Name) nao respondeu em $($t.Uri)"
              }

              if ($code -ge 500) {
                  throw "$($t.Name) devolveu HTTP $code em $($t.Uri)"
              }

              Write-Host "$($t.Name) respondeu HTTP $code ($($t.Uri))"
          }
