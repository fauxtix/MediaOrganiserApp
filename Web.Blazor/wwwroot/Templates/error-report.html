<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>{{AppName}} - Error Report</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial;
            color: #212529;
            margin: 0;
            padding: 0;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px;
            background: #f5f7fa;
            border-bottom: 1px solid #e9ecef;
        }

        .container {
            padding: 18px;
        }

        .k {
            font-weight: 600;
            color: #495057;
            margin-right: 6px;
        }

        .level {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: 600;
        }

            .level.info {
                background: #e7f5ff;
                color: #084298;
            }

            .level.warning {
                background: #fff4e6;
                color: #663c00;
            }

            .level.error {
                background: #ffecec;
                color: #842029;
            }

        .message {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #eef1f4;
        }

        footer {
            margin-top: 18px;
            font-size: 12px;
            color: #6c757d;
        }
    </style>
</head>
<body>
    <div class="header"> <div style="font-weight:700;color:#212529">{{AppName}}</div> <div> <div style="margin-left:18px;font-size:14px;color:#6c757d">Automated error report</div> <div style="margin-left:18px;font-size:12px;color:#adb5bd">{{Time}}</div> </div> </div>
    <div class="container">
        <div><span class="k">Level:</span> <span class="level {{LevelClass}}">{{Level}}</span></div>
        <div style="margin-top:8px"><span class="k">Message:</span></div>
        <div class="message">{{Message}}</div>

        <!-- Exception block: leave empty if no exception -->
        <div id="exception-block">{{ExceptionHtml}}</div>

        <footer>
            <div class="mt-2">
                This message was generated by {{AppName}}. If you need help, contact support at {{SupportMail}}.
            </div>
        </footer>
    </div>
</body>
</html>
